[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cross-origin isolation (COOP + COEP) is required for SharedArrayBuffer: the
# worklet play ring, the analysis tap and the SDL3 (-pthread) backend. See
# docs/DEPLOYMENT.md → Cross-origin isolation.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# Root-hosted build. With PUBLIC_PATH=/<base>/, change this to "/<base>/service-worker.js".
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
